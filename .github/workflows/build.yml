name: Build Canary

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Install and Build
      working-directory: MaiChartManager/Front
      run: |
        pnpm install
        pnpm build

    - name: Install and Build Mai2-TouchTest
      working-directory: Mai2-TouchTest
      run: |
        pnpm install --frozen-lockfile
        pnpm --filter @mai2-touchtest/webtest build
        rm -rf ../MaiChartManager/wwwroot/touch-test
        cp -r apps/webtest/dist ../MaiChartManager/wwwroot/touch-test

    - name: Upload wwwroot
      uses: actions/upload-artifact@v4
      with:
        name: wwwroot
        path: MaiChartManager/wwwroot

  build-editor-web:
    name: Build AquaMai Config Editor (standalone web)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    # 浏览器里跑的是 AquaMai 自己的配置解析库，编辑器构建时需要它的 publish 产物
    - name: Publish AquaMai config WASM
      run: dotnet publish AquaMai.Config.Wasm/AquaMai.Config.Wasm.csproj -c Release

    - name: Install and Build editor
      working-directory: AquaMai.Config.Editor
      run: |
        pnpm install
        pnpm typecheck
        pnpm build

    - name: Upload standalone editor
      uses: actions/upload-artifact@v4
      with:
        name: aquamai-config-editor
        path: AquaMai.Config.Editor/dist

  build:
    name: Build
    runs-on: self-hosted
    needs: build-frontend
    
    steps:
    - run: git config --global core.longPaths true
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Checkout Assets
      uses: clansty/checkout@main
      with:
        repository: MuNET-OSS/AquaMai-Build-Assets
        token: ${{ secrets.BUILD_ASSETS_PAT }}
        path: build-assets
        max-attempts: 50
        min-retry-interval: 1
        max-retry-interval: 5

    - name: Copy Assets
      shell: powershell
      run: |
        Write-Host "Copying assets..."
        Copy-Item -Path "build-assets/SDEZ/*" -Destination "AquaMai/Libs/" -Recurse -Force

    - name: Setup Nuget
      run: |
        dotnet nuget list source
        if (-not (dotnet nuget list source | Select-String "nuget.org")) {
            dotnet nuget add source https://api.nuget.org/v3/index.json -n nuget.org
        }

    - name: Download wwwroot
      uses: actions/download-artifact@v4
      with:
        name: wwwroot
        path: MaiChartManager/wwwroot

    - name: Build
      shell: powershell
      run: |
        .\Packaging\Build.ps1 -Mode Canary

    - name: Upload to Alist
      shell: pwsh
      env:
        ALIST_TOKEN: ${{ secrets.ALIST_TOKEN }}
      run: |
        $alistUrl = "https://alist.c5y.moe"
        
        # 找到构建产物
        $appxFile = Get-ChildItem -Path "Packaging" -Filter "MaiChartManager_Canary_*.appx" | Select-Object -First 1
        if (-not $appxFile) {
            throw "No appx file found!"
        }
        
        Write-Host "Uploading $($appxFile.Name)..."
        
        # 上传文件
        $remotePath = "/SBGA/MaiChartManager Canary/$($appxFile.Name)"
        $encodedPath = [System.Uri]::EscapeDataString($remotePath)
        
        $headers = @{
            "Authorization" = $env:ALIST_TOKEN
            "File-Path" = $encodedPath
        }
        
        Invoke-RestMethod -Uri "$alistUrl/api/fs/put" -Method Put -InFile $appxFile.FullName -Headers $headers
        
        Write-Host "Upload complete: $remotePath"

    - name: Update AppInstaller Config
      shell: powershell
      run: |
        # 1. 获取构建好的 Appx 文件名来提取版本号
        $appxFile = Get-ChildItem -Path "Packaging" -Filter "MaiChartManager_Canary_*.appx" | Select-Object -First 1
        if (-not $appxFile) { throw "Appx file not found for version extraction!" }
        
        # 2. 提取版本号 (假设文件名格式为 MaiChartManager_Canary_1.2.3.4.appx)
        $version = $appxFile.Name -replace 'MaiChartManager_Canary_', '' -replace '.appx', ''
        Write-Host "Detected Version: $version"
        
        # 3. 执行更新脚本
        & "D:\sign\mcm-canary-update.ps1" -Version $version

    - name: Delete wwwroot artifact
      uses: geekyeggo/delete-artifact@v5
      with:
        name: wwwroot
